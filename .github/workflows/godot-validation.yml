name: Godot Headless Validation

on:
  push:
    branches: [main, "feature/**", "fix/**"]
    paths:
      - "**.gd"
      - "**.tscn"
      - "**.tres"
      - "**.glb"
      - "project.godot"
      - ".github/workflows/godot-validation.yml"
  pull_request:
    branches: [main]
    paths:
      - "**.gd"
      - "**.tscn"
      - "**.tres"
      - "**.glb"
      - "project.godot"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.7.2
    steps:
      - name: Install system font support
        run: apt-get update && apt-get install -y fontconfig
      - name: Check out project
        uses: actions/checkout@v4
      - name: Import assets and initialize Godot project
        run: godot --headless --editor --path . --quit
      - name: Parse every GDScript file
        run: godot --headless --path . --script res://tests/parse_all_scripts.gd
      - name: Run prone, crouch, stand, and camera smoke tests
        run: godot --headless --path . --script res://tests/stance_smoke_test.gd
      - name: Launch main scene headlessly and reject runtime script errors
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . --quit-after 120 2>&1 | tee /tmp/godot-runtime.log
          if grep -E 'SCRIPT ERROR:|Parse Error:' /tmp/godot-runtime.log; then
            echo 'Godot runtime reported script errors.'
            exit 1
          fi
